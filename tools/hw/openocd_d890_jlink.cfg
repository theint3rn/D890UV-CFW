# D890UV (STM32U575) via SEGGER J-Link, through OpenOCD (hw.py --probe jlink-openocd).
# The default J-Link path (hw.py --probe jlink) uses SEGGER's own tools instead and needs no OpenOCD.
source [find interface/jlink.cfg]
transport select swd
adapter speed 4000
reset_config srst_only srst_nogate connect_assert_srst
source [find target/stm32u5x.cfg]
source [file join [file dirname [info script]] openocd_common.cfg]
