# D168UV (Artery AT32F403A) via SEGGER J-Link through OpenOCD (hw.py --probe jlink-openocd; default --probe jlink needs no OpenOCD).
#   openocd -f tools/hw/openocd_d168_jlink.cfg
# Upstream OpenOCD has target/artery/at32f4x.cfg + the 'artery' flash driver only in recent versions (2025+, single
# bank: bank 2 from 0x08080000 is not covered). Without it this falls back to a plain Cortex-M4 target: reads, RAM,
# RTT and GDB work, flash writes are refused by hw.py (no bank covers the app). Use J-Link for flash writes.
source [find interface/jlink.cfg]
transport select swd
adapter speed 4000
# NRST wired: attach under reset (the stock firmware turns PA13/PA14 into the PF1/PF2 keys)
reset_config srst_only srst_nogate connect_assert_srst
set CHIPNAME at32f403a
if {[catch {source [find target/artery/at32f4x.cfg]} err]} {
    echo "no target/artery/at32f4x.cfg in this OpenOCD: generic Cortex-M4, no flash driver (read-only)"
    source [find target/swj-dp.tcl]
    swj_newdap $CHIPNAME cpu -expected-id 0x2ba01477
    dap create $CHIPNAME.dap -chain-position $CHIPNAME.cpu
    target create $CHIPNAME.cpu cortex_m -dap $CHIPNAME.dap
    $CHIPNAME.cpu configure -work-area-phys 0x20000000 -work-area-size 0x1000 -work-area-backup 0
}
source [file join [file dirname [info script]] openocd_common.cfg]
