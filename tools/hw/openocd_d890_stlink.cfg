# D890UV (STM32U575) via ST-Link V2/V3.   openocd -f tools/hw/openocd_d890_stlink.cfg
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
adapter speed 4000
# NRST wired: attach under reset (the stock firmware turns PA14/SWCLK into the PF2 key input)
reset_config srst_only srst_nogate connect_assert_srst
source [find target/stm32u5x.cfg]
source [file join [file dirname [info script]] openocd_common.cfg]
