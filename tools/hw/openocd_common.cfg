# Shared tail of the openocd_<radio>_<probe>.cfg files (sourced after the target).
# Localhost only: GDB 3333, telnet 4444, TCL 6666 (tools/hw/hw.py).
bindto 127.0.0.1
gdb_port 3333
telnet_port 4444
tcl_port 6666

# GDB `load` must never write flash: flash writes go through tools/hw/hw.py (guarded) only.
gdb_memory_map enable
gdb_flash_program disable

init
